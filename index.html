<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101216">
<title>Meu Trabalho &amp; Ganhos</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#191c22;--panel2:#20242c;--line:#303641;--text:#f3f5f7;--muted:#a7afbb;--green:#36d782;--red:#ff626d;--blue:#83aaff;--gold:#f5c76a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:88px}header{padding:22px 16px 16px;background:#15181e;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:13px}main{max-width:760px;margin:auto;padding:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:#191c22;border-top:1px solid var(--line);padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:5}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 3px;border-radius:12px;font-size:13px}.tabs button.active{background:#2b303a;color:#fff}
button,input,select,textarea{font:inherit}button{cursor:pointer}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.panel h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.spread{justify-content:space-between}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;flex:1}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}input[type=checkbox]{width:auto;accent-color:var(--green)}textarea{min-height:65px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--green);color:#062b18;font-weight:700}.btn.secondary{background:#2b303a;color:var(--text)}.btn.danger{background:#48232a;color:#ffb3b8}.btn.small{padding:7px 10px;font-size:13px}.hidden{display:none!important}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.monthnav strong{font-size:17px;text-align:center}.monthnav button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}.day{min-height:56px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;color:var(--text);padding:5px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}.day.empty{background:transparent;border-color:transparent}.day.selected{outline:2px solid var(--blue)}.day.today{border-color:var(--blue)}.day.worked{background:#17385b;border-color:#2878d0}.day.worked:after{content:"";width:5px;height:5px;border-radius:50%;background:#83aaff}.day.dayoff{background:#59491b;border-color:#f2c94c;color:#fff0b3}.day .eventicon{font-size:12px;line-height:1.1}.day .mini{font-size:9px;color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap}
.green{color:var(--green)!important}.red{color:var(--red)!important}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:18px;margin-top:3px}.chartgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chartcard{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:13px 8px;text-align:center;min-width:0}.chartcard h3{margin:0 0 12px;font-size:16px}.rings{display:flex;flex-direction:column;gap:12px;align-items:center}.ringrow{display:flex;align-items:center;gap:8px;width:100%;justify-content:center}.donut{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative}.donut:before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel)}.donut span{position:relative;font-size:10px;color:var(--muted)}.ringinfo{text-align:left;min-width:0}.ringinfo small{display:block;color:var(--muted);font-size:12px}.ringinfo strong{display:block;font-size:13px;overflow-wrap:anywhere}.chartcard.gains h3{color:var(--green)}.chartcard.expenses h3{color:var(--red)}.netline{display:flex;justify-content:space-between;gap:8px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line);font-size:13px}.entry{padding:12px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry strong{display:block}.entry small{color:var(--muted)}.emptymsg{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#2b303a;color:var(--muted)}.badge.paid{color:var(--green);background:#19392a}.badge.pending{color:var(--gold);background:#3b3220}
@media(min-width:560px){.rings{flex-direction:row;align-items:flex-start}.ringrow{flex-direction:column;gap:5px}.ringinfo{text-align:center}.donut{width:82px;height:82px}.chartcard{padding:16px 12px}}


/* Dashboard financeiro: aprimoramento visual sem alterar os dados */
.dashboard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.dashboard-kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);font-weight:800}
.dashboard-head h2{font-size:22px;margin:3px 0 4px}
.dashboard-head p{font-size:12px;color:var(--muted);margin:0}
.dashboard-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#233047;color:var(--blue);font-size:21px;flex-shrink:0}
.dashboard-hero{background:linear-gradient(135deg,#1b2738,#19251f);border-color:#344356}
.dashboard-hero-label{color:#bdc9d8;font-size:12px}
.dashboard-hero-value{display:block;font-size:28px;line-height:1.25;font-weight:850;letter-spacing:-.7px;margin:4px 0}
.dashboard-hero-note{font-size:11px;color:#aab8c8}
.dashboard-stat{position:relative;overflow:hidden;min-height:94px;border:1px solid var(--line)}
.dashboard-stat:after{content:"";position:absolute;right:-15px;top:-20px;width:62px;height:62px;border-radius:50%;background:currentColor;opacity:.06}
.dashboard-stat .stat-icon{font-size:17px;margin-bottom:5px}
.dashboard-stat strong{font-size:17px;overflow-wrap:anywhere}
.dashboard-stat.gain-card{color:var(--green);background:linear-gradient(145deg,#192d27,var(--panel2))}
.dashboard-stat.expense-card{color:var(--red);background:linear-gradient(145deg,#332126,var(--panel2))}
.dashboard-stat.balance-card{color:var(--blue)}
.dashboard-stat.work-card{color:var(--gold)}
.dashboard-stat small{color:var(--muted)}
.comparison-panel{margin-top:13px}
.comparison-block{padding:12px 0;border-top:1px solid var(--line)}
.comparison-block:first-of-type{border-top:0;padding-top:2px}
.comparison-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
.comparison-title strong{font-size:14px}
.comparison-title span{font-size:11px;color:var(--muted)}
.bar-line{display:grid;grid-template-columns:68px minmax(0,1fr);align-items:center;gap:8px;margin:9px 0}
.bar-label{font-size:12px;color:var(--muted)}
.bar-track{height:10px;background:#303641;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:99px;transition:width .25s ease}
.bar-fill.gain-fill{background:linear-gradient(90deg,#20a965,var(--green))}
.bar-fill.expense-fill{background:linear-gradient(90deg,#d94455,var(--red))}
.bar-value{font-size:12px;font-weight:750;text-align:right;margin-top:3px}
.dashboard-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dashboard-section-title .badge{white-space:nowrap}
.chartgrid{margin-top:13px}
@media(max-width:380px){.dashboard-head h2{font-size:20px}.dashboard-hero-value{font-size:25px}.dashboard-stat{padding:10px}.dashboard-stat strong{font-size:15px}.bar-line{grid-template-columns:58px minmax(0,1fr)}}


.money-breakdown{margin-top:8px;padding:10px;border-radius:10px;background:var(--panel2);font-size:12px;display:grid;gap:5px}
.money-breakdown .money-row{display:flex;justify-content:space-between;gap:8px}
.money-breakdown .remaining{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:800;font-size:13px}
.badge.partial{color:#f6c76b;background:#3b3220}
#evSettled{border-color:#356c51}

.event-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.event-columns .panel{min-width:0;padding:13px}
.event-columns h2{font-size:16px}
.event-columns .entry{overflow-wrap:anywhere}
@media(max-width:420px){.event-columns{gap:8px}.event-columns .panel{padding:10px}.event-columns h2{font-size:14px}.event-columns .entry .row{gap:5px}.event-columns .btn.small{font-size:10px;padding:7px 6px}}
body.light{color-scheme:light;--bg:#f3f5f8;--panel:#ffffff;--panel2:#edf0f5;--line:#d5dbe5;--text:#202633;--muted:#647084;--green:#16834c;--red:#c62838;--blue:#315fb8;--gold:#9a6a00}body.light header{background:#fff}body.light .tabs{background:#fff}body.light .tabs button.active{background:#e2e8f2;color:#202633}body.light .btn.secondary{background:#e2e7ef;color:#202633}body.light .bar-track{background:#dce2eb}body.light .dashboard-hero{background:linear-gradient(135deg,#e7edf8,#e5f5eb);border-color:#cbd6e5}body.light .dashboard-hero-label,body.light .dashboard-hero-note{color:#526176}body.light .dashboard-stat.gain-card{background:#e7f5ec}body.light .dashboard-stat.expense-card{background:#fff0f0}body.light .day.worked{background:#dceaff;color:#193c72}body.light .day.dayoff{background:#fff2c6;color:#6b4c00}
.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}
#upcomingReminders .entry{padding:9px 0}#upcomingReminders .entry:last-child{border-bottom:0}



/* Navegação inferior em botões largos inspirados no Android */
body{padding-bottom:112px}
.tabs.android-bottom-nav{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
 left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));
 padding:8px;background:color-mix(in srgb,var(--bg) 94%,transparent);
 border:0;border-radius:24px;backdrop-filter:blur(14px);
}
.android-bottom-nav button{
 min-width:0;min-height:66px;border:1px solid #34312a;border-radius:22px;
 background:transparent;color:var(--muted);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px;padding:7px 2px;
}
.android-bottom-nav button.active{
 background:#2d2a23;border-color:#f5d96c;color:#ffe477;
 box-shadow:inset 0 0 0 1px #f5d96c33;
}
.android-bottom-nav .nav-icon{font-size:22px;line-height:1.1;font-weight:700}
.android-bottom-nav .nav-label{font-size:10px;line-height:1.1;white-space:nowrap}
body.light .android-bottom-nav button{border-color:var(--line)}
body.light .android-bottom-nav button.active{background:#fff4bf;border-color:#b99a23;color:#5e4a00}
@media(max-width:360px){.tabs.android-bottom-nav{left:6px;right:6px;gap:5px;padding:6px}.android-bottom-nav button{border-radius:18px}.android-bottom-nav .nav-label{font-size:9px}}
/* Configurações organizadas como gaveta de aplicativos: cartões em grade */
.settings-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.settings-tile{min-width:0;margin:0!important;padding:13px!important;border-radius:17px;background:var(--panel2);border:1px solid var(--line)}
.settings-tile h2{font-size:14px;display:flex;align-items:center;gap:8px;line-height:1.3;margin:0 0 9px!important}
.settings-tile .tile-icon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#343126;color:#ffe477;font-size:19px;flex-shrink:0}
.settings-tile p{font-size:12px!important;line-height:1.4}
.settings-tile .row{align-items:stretch}
.settings-tile .row>*{flex:1}
.settings-tile .btn{width:100%;font-size:12px;padding:9px 7px;overflow-wrap:anywhere}
.settings-tile .field{margin-bottom:9px}
.settings-tile .field:last-child{margin-bottom:0}
.settings-tile .field label{font-size:12px}
.settings-intro{margin-bottom:12px}
@media(max-width:380px){.settings-tiles{gap:8px}.settings-tile{padding:10px!important}.settings-tile h2{font-size:13px}.settings-tile .tile-icon{width:30px;height:30px}}

/* Simplificação visual e orientação para uso no celular */
.panel h2{line-height:1.3}
.field label{font-weight:600}
.field input,.field select,.field textarea{min-height:45px}
.btn{min-height:44px}
.btn.secondary{border:1px solid var(--line)}
.help-hint{font-size:12px;color:var(--muted);margin:5px 0 12px;line-height:1.45}
.quick-guide{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:13px;font-size:13px}
.quick-guide .guide-icon{font-size:19px;flex-shrink:0}
.optional-fields{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 12px}
.optional-fields summary{cursor:pointer;font-weight:700;font-size:14px;padding:3px 0}
.optional-fields[open] summary{margin-bottom:12px}
.section-hint{font-size:12px;color:var(--muted);margin:-5px 0 12px}
@media(max-width:380px){main{padding:10px}.panel{padding:12px}.row{gap:8px}.field label{font-size:12px}}

/* Toque visual mais limpo no celular: remove o realce azul de foco/toque sem alterar funções. */
* { -webkit-tap-highlight-color: transparent; }
button, .tap-detail, .day, .tabs button {
  -webkit-tap-highlight-color: transparent;
}
button:focus, button:focus-visible,
.tap-detail:focus, .tap-detail:focus-visible,
.day:focus, .day:focus-visible,
.tabs button:focus, .tabs button:focus-visible {
  outline: none !important;
  box-shadow: none !important;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  box-shadow: none;
}



/* Ajuste final da barra inferior no site: sempre acima do conteúdo e sem transparência */
nav.tabs.android-bottom-nav{
 position:fixed!important;
 z-index:99999!important;
 isolation:isolate;
 bottom:0!important;
 left:0!important;
 right:0!important;
 width:100%!important;
 margin:0!important;
 padding:8px 8px max(8px,env(safe-area-inset-bottom))!important;
 background:var(--bg)!important;
 border-top:1px solid var(--line)!important;
 border-radius:22px 22px 0 0!important;
 backdrop-filter:none!important;
 -webkit-backdrop-filter:none!important;
 box-shadow:0 -8px 24px #0005;
}
nav.tabs.android-bottom-nav button{
 height:60px!important;
 min-height:60px!important;
 padding:5px 2px!important;
 margin:0!important;
 display:flex!important;
 flex-direction:column!important;
 align-items:center!important;
 justify-content:center!important;
 gap:4px!important;
 line-height:1!important;
 transform:none!important;
 position:relative!important;
}
nav.tabs.android-bottom-nav .nav-icon{
 display:block!important;
 line-height:1!important;
 height:23px!important;
 margin:0!important;
 padding:0!important;
 transform:none!important;
}
nav.tabs.android-bottom-nav .nav-label{
 display:block!important;
 line-height:1.1!important;
 margin:0!important;
 padding:0!important;
 transform:none!important;
}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))!important}

/* Painel de metas simples e sem sobreposição */
.goals-panel{position:relative;display:block;width:100%;margin:12px 0;clear:both}
.goals-panel .dashboard-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.goals-panel .dashboard-section-title h2{font-size:16px}
.goals-panel .goals-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goals-panel .goals-fields .field{min-width:0;margin-bottom:8px}
.goals-panel .goals-fields label{font-size:12px;line-height:1.35}
.goals-panel input{min-width:0}
@media(max-width:360px){.goals-panel .goals-fields{grid-template-columns:1fr;gap:0}}


#tab-summary .chartgrid,#tab-summary .comparison-panel{display:none!important}
#tab-summary .comparison-panel{margin-top:0}
#tab-summary .comparison-block{padding:10px 0}
#tab-summary .comparison-title{margin-bottom:8px}
.savings-balance{font-size:25px;font-weight:850;color:var(--gold);display:block;margin:5px 0}
.savings-ledger{margin-top:10px}.savings-ledger .entry{padding:9px 0}

/* Atualização visual: calendário em destaque e informações secundárias em pop-ups */
#tab-calendar>.quick-guide{display:none!important}
#tab-calendar #upcomingPanel{padding:10px 13px;margin-bottom:10px}
#tab-calendar #upcomingPanel p{margin-bottom:4px!important}
#tab-calendar #upcomingReminders{max-height:64px;overflow:hidden}
#tab-calendar #dayEditorPanel{display:none!important}
#tab-calendar .calendar-panel{padding:12px}
#tab-calendar .day{min-height:clamp(48px,8.5vh,72px);font-size:14px;border-radius:11px}
#tab-calendar .calendar{gap:6px}
#tab-calendar .monthnav{margin-bottom:14px}
#tab-summary>.quick-guide{display:none!important}
.quick-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 13px}
.quick-tile{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.quick-tile>span{font-size:22px}.quick-tile small{color:var(--muted)}.quick-tile strong{font-size:18px;overflow-wrap:anywhere}.quick-tile em{font-size:11px;color:var(--muted);font-style:normal}
#tab-summary .goals-panel,#tab-summary #savingsPanel{display:none!important}
#tab-summary .dashboard-head{margin-bottom:9px}#tab-summary .dashboard-head h2{font-size:20px}
#tab-events>.quick-guide{display:none!important}
#sectionDetailOverlay{z-index:10001}
#dayEditorOverlay{z-index:10002}
@media(max-width:390px){#tab-calendar .day{min-height:48px;padding:4px 1px;font-size:12px}#tab-calendar .calendar{gap:3px}.quick-tile{padding:11px}}

/* Resumo visual compacto abaixo do calendário */
.visual-summary{padding:14px;overflow:hidden}
.visual-summary-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.visual-summary-heading h2{margin:2px 0 0;font-size:18px}
.visual-summary-kicker{font-size:10px;font-weight:850;letter-spacing:1.2px;color:var(--blue)}
.visual-summary-main{display:flex;flex-direction:column;align-items:center;gap:6px}
.summary-ring{--ring-size:236px;width:var(--ring-size);height:var(--ring-size);flex:0 0 auto;border-radius:50%;padding:13px;display:grid;place-items:center;background:conic-gradient(#347fe8 0deg 57deg,#101216 57deg 60deg,#e64b43 60deg 117deg,#101216 117deg 120deg,#f3b51b 120deg 177deg,#101216 177deg 180deg,#16a66a 180deg 237deg,#101216 237deg 240deg,#ad50c7 240deg 297deg,#101216 297deg 300deg,#12a9c1 300deg 357deg,#101216 357deg 360deg);box-shadow:0 0 0 1px #ffffff0a;transition:background .25s ease;position:relative}
.summary-ring:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #ffffff0a;pointer-events:none}
.summary-ring-center{width:100%;height:100%;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:8px}
.summary-ring-center small{font-size:13px;font-weight:800;color:var(--text);margin-bottom:3px}
.summary-ring-center strong{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.summary-ring-center span{font-size:10px;color:var(--muted);line-height:1.1}
.visual-summary-caption{margin:2px 0 12px;color:var(--muted);font-size:11px;text-align:center}
.visual-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.visual-metric{min-width:0;position:relative;border:1px solid color-mix(in srgb,var(--metric-color) 65%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--metric-color) 10%,var(--panel2)),var(--panel2));border-radius:12px;padding:10px 11px 9px;border-left:3px solid var(--metric-color);cursor:pointer}
.visual-met
